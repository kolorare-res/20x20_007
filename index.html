<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diorama WebAR - 6 Livelli con Fondo Sovrapposto</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- Componente LERP (Smooth Tracker) -->
  <script>
    AFRAME.registerComponent('smooth-tracker', {
      schema: {
        factor: { type: 'number', default: 0.35 }
      },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;

        const object3D = this.el.object3D;
        
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }

        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    .a-enter-vr-button { display: none !important; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights; antialias: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="ar-target" mindar-image-target="targetIndex: 0" smooth-tracker="factor: 0.35">
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      // ==========================================
      // 1. CONFIGURAZIONE DEI 6 LIVELLI PNG
      // ==========================================
      const layersConfig = [
        { src: "./images/layer01.png", z: 0.00 }, // Sfondo scatola
        { src: "./images/layer02.png", z: 0.08 },
        { src: "./images/layer03.png", z: 0.16 },
        { src: "./images/layer04.png", z: 0.24 },
        { src: "./images/layer05.png", z: 0.32 },
        { src: "./images/layer06.png", z: 0.40 }  // Bordo frontale
      ];

      const planeWidth = 1;
      const planeHeight = 1;
      const bottomTexture = "./images/box_bottom.png"; 

      // ==========================================
      // 2. CREAZIONE DEL FONDO CON OVERLAP
      // ==========================================
      const overlapZ = -0.01; // Spinge la base 1cm dietro il Layer01 (Z = -0.01)
      const frontMargin = 0.005; // 0.5cm di margine extra sul fronte per chiudere perfettamente

      const zBack = layersConfig[0].z + overlapZ; // Inizio reale (-0.01)
      const zFront = layersConfig[layersConfig.length - 1].z + frontMargin; // Fine reale (0.405)

      const bottomLengthExact = zFront - zBack; // Lunghezza totale corretta
      const bottomCenterZExact = zBack + (bottomLengthExact / 2); // Centro preciso

      const bottomPlane = document.createElement("a-plane");
      bottomPlane.setAttribute("width", planeWidth);
      bottomPlane.setAttribute("height", bottomLengthExact);
      
      // Abbassato leggermente sull'asse Y (-0.501) per evitare intersezioni con il bordo inferiore dei layer
      bottomPlane.setAttribute("position", `0 -${(planeHeight / 2 + 0.001).toFixed(4)} ${bottomCenterZExact.toFixed(4)}`);
      bottomPlane.setAttribute("rotation", "-90 0 0");

      if (bottomTexture) {
        bottomPlane.setAttribute("src", bottomTexture);
        bottomPlane.setAttribute("material", "transparent: true; alphaTest: 0.5; side: double; depthTest: true;");
      } else {
        bottomPlane.setAttribute("material", "color: #0b131a; roughness: 0.9; side: double; depthTest: true;");
      }

      targetEntity.appendChild(bottomPlane);

      // ==========================================
      // 3. GENERAZIONE DEI 6 PIANI (LAYER PNG)
      // ==========================================
      layersConfig.forEach((layer, idx) => {
        const plane = document.createElement("a-plane");
        
        plane.setAttribute("src", layer.src);
        plane.setAttribute("width", planeWidth);
        plane.setAttribute("height", planeHeight);
        plane.setAttribute("position", `0 0 ${layer.z.toFixed(4)}`);
        
        plane.setAttribute("material", `
          transparent: true; 
          alphaTest: 0.5; 
          side: front;
          depthTest: true;
        `);
        
        plane.setAttribute("render-order", 10 + idx);
        
        targetEntity.appendChild(plane);
      });
    });
  </script>
  
</body>
</html>
