<!DOCTYPE html>
<html lang="it">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    AFRAME.registerComponent('png-paper-extrude', {
      schema: {
        src: { type: 'string' },
        depth: { type: 'number', default: 0.002 }, // 2 mm
        width: { type: 'number', default: 0.2 },   // 20 cm
        height: { type: 'number', default: 0.2 }   // 20 cm
      },
      init: function () {
        const el = this.el;
        const data = this.data;

        // Recupera il path corretto
        let imgSrc = data.src;
        if (data.src.startsWith('#')) {
          const imgEl = document.querySelector(data.src);
          if (imgEl) {
            imgSrc = imgEl.getAttribute('src');
          }
        }

        const loader = new THREE.TextureLoader();
        loader.load(
          imgSrc, 
          (texture) => {
            // Compatibilità colori sicura tra versioni Three.js
            if ('colorSpace' in texture && typeof THREE.SRGBColorSpace !== 'undefined') {
              texture.colorSpace = THREE.SRGBColorSpace;
            }

            const geometry = new THREE.BoxGeometry(data.width, data.height, data.depth);
            const material = new THREE.MeshStandardMaterial({
              map: texture,
              transparent: true,
              alphaTest: 0.2,
              roughness: 0.8,
              metalness: 0.1,
              side: THREE.DoubleSide
            });

            const mesh = new THREE.Mesh(geometry, material);
            el.setObject3D('mesh', mesh);
          },
          undefined,
          (err) => {
            console.error("Errore caricamento immagine AR:", imgSrc, err);
          }
        );
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <img id="space01-a" src="images/space01_a.png">
      <img id="space01-b" src="images/space01_b.png">
      <img id="space01-c" src="images/space01_c.png">
      <img id="space01-bottom" src="images/space01_bottom.png">
      <img id="space01-left" src="images/space01_left.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Luce d'ambiente e direzionale -->
    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="directional" position="1 2 3" intensity="0.8"></a-light>

    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Space01: 3 Layer Parallasse (Frontali) -->
      <a-entity png-paper-extrude="src: #space01-a; width: 0.2; height: 0.2;" position="0 0 0.160"></a-entity>
      <a-entity png-paper-extrude="src: #space01-b; width: 0.2; height: 0.2;" position="0 0 0.163"></a-entity>
      <a-entity png-paper-extrude="src: #space01-c; width: 0.2; height: 0.2;" position="0 0 0.166"></a-entity>

      <!-- Space01: Bottom-Box -->
      <a-entity png-paper-extrude="src: #space01-bottom; width: 0.2; height: 0.04;" 
                rotation="-90 0 0" 
                position="0 -0.10 0.16">
      </a-entity>

      <!-- Space01: Parete Sinistra -->
      <a-entity png-paper-extrude="src: #space01-left; width: 0.04; height: 0.2;" 
                rotation="0 90 0" 
                position="-0.10 0 0.16">
      </a-entity>

    </a-entity>
  </a-scene>
</body>
</html>
