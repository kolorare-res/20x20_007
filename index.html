<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diorama WebAR - 6 Livelli</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- Componente LERP (Smooth Tracker) -->
  <script>
    AFRAME.registerComponent('smooth-tracker', {
      schema: {
        factor: { type: 'number', default: 0.35 }
      },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;

        const object3D = this.el.object3D;
        
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }

        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    .a-enter-vr-button { display: none !important; }
  </style>
</head>
<body>

  <!-- Inserisci il percorso del tuo file .mind in imageTargetSrc -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights; antialias: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="ar-target" mindar-image-target="targetIndex: 0" smooth-tracker="factor: 0.35">
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      // ==========================================
      // 1. CONFIGURAZIONE DEI 6 LIVELLI PNG
      // ==========================================
      // Inserisci i percorsi delle tue immagini e la profondità (z).
      // z = 0 indica il piano dell'immagine target.
      // Valori di z positivi spingono i livelli verso l'osservatore (in avanti).
      const layersConfig = [
        { src: "./images/layer01.png", z: 0.00 }, // Sfondo (attaccato al target)
        { src: "./images/layer02.png", z: 0.08 },
        { src: "./images/layer03.png", z: 0.16 },
        { src: "./images/layer04.png", z: 0.24 },
        { src: "./images/layer05.png", z: 0.32 },
        { src: "./images/layer06.png", z: 0.40 }  // Primo piano
      ];

      // Dimensioni del piano AR (1 = uguale alla dimensione del target tracciato)
      const planeWidth = "1";
      const planeHeight = "1";

      // ==========================================
      // 2. GENERAZIONE AUTOMATICA DEI PIANI 3D
      // ==========================================
      layersConfig.forEach((layer, idx) => {
        const plane = document.createElement("a-plane");
        
        // Attributi geometrici e sorgente
        plane.setAttribute("src", layer.src);
        plane.setAttribute("width", planeWidth);
        plane.setAttribute("height", planeHeight);
        plane.setAttribute("position", `0 0 ${layer.z.toFixed(4)}`);
        
        // Trasparenza ottimizzata per evitare glitch visivi tra i layer
        plane.setAttribute("material", `
          transparent: true; 
          alphaTest: 0.5; 
          side: front;
          depthTest: true;
        `);
        
        // Garantisce l'ordine di rendering corretto (dal più lontano al più vicino)
        plane.setAttribute("render-order", 10 + idx);
        
        targetEntity.appendChild(plane);
      });
    });
  </script>
  
</body>
</html>
