<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diorama WebAR - Ripristino Curva e Bottom Standard</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- Componente LERP (Smooth Tracker) -->
  <script>
    AFRAME.registerComponent('smooth-tracker', {
      schema: { factor: { type: 'number', default: 0.35 } },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;
        const object3D = this.el.object3D;
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }
        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    .a-enter-vr-button { display: none !important; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights; antialias: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0" smooth-tracker="factor: 0.35"></a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      function fromTopLeft(xCm, yCm) {
        return { x: (xCm / 100) - 0.5, y: 0.5 - (yCm / 100) };
      }

      // ==========================================
      // 1. CONFIGURAZIONE DEI LIVELLI PNG
      // ==========================================
      const layersConfig = [
        { src: "./images/layer01.png", z: 0.00 },
        { src: "./images/layer02.png", z: 0.08 },
        { src: "./images/layer03.png", z: 0.16 },
        { src: "./images/layer04.png", z: 0.24 },
        { src: "./images/layer05.png", z: 0.32, thickness: 0.004 },
        { src: "./images/layer06.png", z: 0.40 }
      ];

      const extraOverlayPng = "./images/layer05_extra.png";
      const leafPng = "./images/leaf.png"; 
      const extraOverlayOffsetZ = 0.01; 

      const planeWidth = 1;
      const planeHeight = 1;
      const bottomTexture = "./images/box_bottom.png"; 
      const layer05BottomTexture = "./images/layer05_bottom.png"; 
      const sideTexture = "./images/layer05-box_side.png"; 

      // ==========================================
      // 2. BASE GENERALE E LAYER05_BOTTOM
      // ==========================================
      const overlapZ = -0.01; 
      const frontMargin = 0.005; 
      const zBack = layersConfig[0].z + overlapZ; 
      const zFront = layersConfig[layersConfig.length - 1].z + frontMargin; 
      const bottomLengthExact = zFront - zBack; 
      const bottomCenterZExact = zBack + (bottomLengthExact / 2); 
      const bottomYPos = -(planeHeight / 2 + 0.001);

      // A) Piano Base generale (box_bottom.png)
      const bottomPlane = document.createElement("a-plane");
      bottomPlane.setAttribute("width", planeWidth);
      bottomPlane.setAttribute("height", bottomLengthExact);
      bottomPlane.setAttribute("position", `0 ${bottomYPos.toFixed(4)} ${bottomCenterZExact.toFixed(4)}`);
      bottomPlane.setAttribute("rotation", "-90 0 0");
      bottomPlane.setAttribute("material", `src: url(${bottomTexture}); transparent: true; alphaTest: 0.5; side: double; depthTest: true;`);
      bottomPlane.setAttribute("render-order", 1);
      targetEntity.appendChild(bottomPlane);

      // B) Striscia Layer05 Bottom (tra Layer05 Z=0.32 e Layer06 Z=0.40)
      const zLayer05 = layersConfig[4].z; // 0.32
      const zLayer06 = layersConfig[5].z; // 0.40
      const stripDepth = zLayer06 - zLayer05; // 0.08
      const stripCenterZ = zLayer05 + (stripDepth / 2); 

      const layer05BottomPlane = document.createElement("a-plane");
      layer05BottomPlane.setAttribute("width", planeWidth);
      layer05BottomPlane.setAttribute("height", stripDepth);
      layer05BottomPlane.setAttribute("position", `0 ${(bottomYPos + 0.0005).toFixed(4)} ${stripCenterZ.toFixed(4)}`);
      layer05BottomPlane.setAttribute("rotation", "-90 0 0");
      layer05BottomPlane.setAttribute("material", `
        src: url(${layer05BottomTexture}); 
        transparent: true; 
        alphaTest: 0.01; 
        depthWrite: false; 
        depthTest: true;
        side: double;
      `);
      layer05BottomPlane.setAttribute("render-order", 2);
      targetEntity.appendChild(layer05BottomPlane);

      // ==========================================
      // 3. RACCORDO CURVO SX (RIPRISTINATO ALLA VERSIONE PRECEDENTE)
      // ==========================================
      const curveRadius = zLayer06 - zLayer05; // 0.08 (8 cm)
      const wallThickness = 0.004;        // Spessore 4 mm
      const overlapCorrection = 0.001;     // Tolleranza anti-spazi vuoti

      const curveCenterX = -(planeWidth / 2) + overlapCorrection;
      const curveCenterZ = zLayer05;

      // Superficie Curva Esterna
      const outerCurvedSide = document.createElement("a-cylinder");
      outerCurvedSide.setAttribute("radius", curveRadius);
      outerCurvedSide.setAttribute("height", planeHeight);
      outerCurvedSide.setAttribute("theta-start", 90);
      outerCurvedSide.setAttribute("theta-length", 90);
      outerCurvedSide.setAttribute("open-ended", "true");
      outerCurvedSide.setAttribute("position", `${curveCenterX.toFixed(4)} 0 ${curveCenterZ.toFixed(4)}`);
      outerCurvedSide.setAttribute("material", `src: url(${sideTexture}); transparent: true; alphaTest: 0.01; side: double; depthTest: true;`);
      outerCurvedSide.setAttribute("render-order", 15);
      targetEntity.appendChild(outerCurvedSide);

      // Superficie Curva Interna (Spessore 4 mm)
      const innerCurvedSide = document.createElement("a-cylinder");
      innerCurvedSide.setAttribute("radius", curveRadius - wallThickness);
      innerCurvedSide.setAttribute("height", planeHeight);
      innerCurvedSide.setAttribute("theta-start", 90);
      innerCurvedSide.setAttribute("theta-length", 90);
      innerCurvedSide.setAttribute("open-ended", "true");
      innerCurvedSide.setAttribute("position", `${curveCenterX.toFixed(4)} 0 ${curveCenterZ.toFixed(4)}`);
      innerCurvedSide.setAttribute("material", `src: url(${sideTexture}); transparent: true; alphaTest: 0.01; side: double; depthTest: true;`);
      innerCurvedSide.setAttribute("render-order", 14);
      targetEntity.appendChild(innerCurvedSide);

      // ==========================================
      // 4. GENERAZIONE LAYER E ANIMAZIONE FOGLIE MULTIPLE
      // ==========================================
      layersConfig.forEach((layer, idx) => {
        let element;
        if (layer.thickness) {
          element = document.createElement("a-box");
          element.setAttribute("width", planeWidth);
          element.setAttribute("height", planeHeight);
          element.setAttribute("depth", layer.thickness); 
          element.setAttribute("position", `0 0 ${layer.z.toFixed(4)}`);
          element.setAttribute("material", `src: url(${layer.src}); transparent: true; alphaTest: 0.01; side: front; depthTest: true;`);
        } else {
          element = document.createElement("a-plane");
          element.setAttribute("src", layer.src);
          element.setAttribute("width", planeWidth);
          element.setAttribute("height", planeHeight);
          element.setAttribute("position", `0 0 ${layer.z.toFixed(4)}`);
          element.setAttribute("material", `transparent: true; alphaTest: 0.01; side: front; depthTest: true;`);
        }
        element.setAttribute("render-order", 10 + idx);
        targetEntity.appendChild(element);

        if (idx === 4) { 
          const overlayZPos = layer.z + extraOverlayOffsetZ;

          // Box Extra Overlay
          const overlayBox = document.createElement("a-box");
          overlayBox.setAttribute("width", planeWidth);
          overlayBox.setAttribute("height", planeHeight);
          overlayBox.setAttribute("depth", 0.004); 
          overlayBox.setAttribute("position", `0 0 ${overlayZPos.toFixed(4)}`);
          overlayBox.setAttribute("material", `src: url(${extraOverlayPng}); transparent: true; alphaTest: 0.01; depthWrite: false; depthTest: true; side: front;`);
          overlayBox.setAttribute("render-order", 20);
          targetEntity.appendChild(overlayBox);

          // Sistema Foglie Multiple (Cadono e svaniscono sotto il fondo)
          const totalLeaves = 5;
          const startCoords = fromTopLeft(0.5, 7.0);   
          const endCoords   = fromTopLeft(12.3, 22.0); // Y > 20cm spinge la foglia sotto la base

          for (let i = 0; i < totalLeaves; i++) {
            const leaf = document.createElement("a-plane");
            const randomDelay = i * 800 + Math.random() * 400;
            const randomDuration = 3200 + Math.random() * 1000;
            const randomScale = 0.06 + Math.random() * 0.04;
            const offsetX = (Math.random() - 0.5) * 0.05;
            const leafZ = overlayZPos + 0.003 + (i * 0.0005);

            leaf.setAttribute("width", randomScale);
            leaf.setAttribute("height", randomScale);
            leaf.setAttribute("position", `${(startCoords.x + offsetX).toFixed(4)} ${startCoords.y.toFixed(4)} ${leafZ.toFixed(4)}`);
            leaf.setAttribute("material", `src: url(${leafPng}); transparent: true; alphaTest: 0.01; depthWrite: false; depthTest: true;`);

            leaf.setAttribute("animation__pos", `
              property: position; 
              from: ${(startCoords.x + offsetX).toFixed(4)} ${startCoords.y.toFixed(4)} ${leafZ.toFixed(4)}; 
              to: ${(endCoords.x + offsetX).toFixed(4)} ${endCoords.y.toFixed(4)} ${leafZ.toFixed(4)}; 
              dur: ${randomDuration}; 
              delay: ${randomDelay};
              easing: easeInQuad; 
              loop: true;
            `);

            leaf.setAttribute("animation__rot", `
              property: rotation; 
              from: 0 0 ${-20 + Math.random() * 10}; 
              to: 0 0 ${30 + Math.random() * 20}; 
              dur: ${1200 + Math.random() * 600}; 
              dir: alternate; 
              easing: easeInOutSine; 
              loop: true;
            `);

            leaf.setAttribute("render-order", 21);
            targetEntity.appendChild(leaf);
          }
        }
      });
    });
  </script>
</body>
</html>
