<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diorama WebAR - Misure Proporzionate 20x4 cm</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- Componente LERP (Smooth Tracker) -->
  <script>
    AFRAME.registerComponent('smooth-tracker', {
      schema: { factor: { type: 'number', default: 0.35 } },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;
        const object3D = this.el.object3D;
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }
        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    .a-enter-vr-button { display: none !important; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights; antialias: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0" smooth-tracker="factor: 0.35"></a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      // ==========================================
      // 1. CONFIGURAZIONE DEI LIVELLI PNG (3 mm = 0.015 unità A-Frame)
      // ==========================================
      const thickness3mm = 0.015; // 3 mm reali (0.015 unità A-Frame)
      const planeWidth = 1.0;     // 1.0 unità = 20 cm reali
      const planeHeight = 1.0;    // 1.0 unità = 20 cm reali
      const depth4cmRel = 0.20;   // 4 cm reali (0.20 unità)

      // Configurazione dei layer principali
      const layersConfig = [
        { src: "./images/layer01.png", z: 0.0075, thickness: thickness3mm },
        { src: "./images/layer02.png", z: 0.2000, thickness: thickness3mm },
        { src: "./images/layer03.png", z: 0.3925, thickness: thickness3mm },
        { 
          src: "./images/layer04.png", 
          z: 0.5850, 
          thickness: thickness3mm,
          bottomTexture: "./images/layer04_bottom.png",
          topTexture: "./images/layer04_top.png",
          topYPos: -0.0500, // 11 cm dall'alto (-1 cm dal centro)
          // Configurazione Overlay Extra Layer 04 (distanza 1.5 cm = 0.075 unità)
          extraOverlay: {
            src: "./images/layer04_extra.png",
            offsetZ: 0.0900 // Centro L04 (0.5850) + Faccia (0.0075) + Distanza (0.075) + Metà Spessore (0.0075) = 0.6750 (diff: +0.0900)
          }
        },
        { 
          src: "./images/layer05.png", 
          z: 0.7775, 
          thickness: thickness3mm,
          bottomTexture: "./images/layer05_bottom.png",
          customDepth: depth4cmRel,
          // Configurazione Overlay Extra Layer 05
          extraOverlay: {
            src: "./images/layer05_extra.png",
            offsetZ: 0.0151
          }
        },
        { src: "./images/layer06.png", z: 0.9925, thickness: thickness3mm }
      ];

      const bottomTexture = "./images/box_bottom.png"; 
      const sideTexture = "./images/layer05-box_side.png"; 

      // ==========================================
      // 2. PIANO BASE GENERALE (box_bottom.png)
      // ==========================================
      const overlapZ = -0.01; 
      const frontMargin = 0.005; 
      
      const zBack = (layersConfig[0].z - thickness3mm / 2) + overlapZ; 
      const zFront = (layersConfig[layersConfig.length - 1].z + thickness3mm / 2) + frontMargin; 
      
      const bottomLengthExact = zFront - zBack; 
      const bottomCenterZExact = zBack + (bottomLengthExact / 2); 
      const bottomYPos = -(planeHeight / 2 + 0.001);

      const bottomPlane = document.createElement("a-plane");
      bottomPlane.setAttribute("width", planeWidth);
      bottomPlane.setAttribute("height", bottomLengthExact);
      bottomPlane.setAttribute("position", `0 ${bottomYPos.toFixed(4)} ${bottomCenterZExact.toFixed(4)}`);
      bottomPlane.setAttribute("rotation", "-90 0 0");
      bottomPlane.setAttribute("material", `src: url(${bottomTexture}); transparent: true; alphaTest: 0.5; side: double; depthTest: true;`);
      bottomPlane.setAttribute("render-order", 1);
      targetEntity.appendChild(bottomPlane);

      // ==========================================
      // 3. GENERAZIONE AUTOMATICA DEI PIANI ORIZZONTALI (BOTTOM & TOP)
      // ==========================================
      layersConfig.forEach((layer, idx) => {
        const nextLayer = layersConfig[idx + 1];

        if (layer.bottomTexture || layer.topTexture) {
          const zCurrentFront = layer.z + (thickness3mm / 2);
          
          let stripDepth = layer.customDepth;
          if (!stripDepth && nextLayer) {
            const zNextBack = nextLayer.z - (thickness3mm / 2);
            stripDepth = zNextBack - zCurrentFront;
          }

          const stripCenterZ = zCurrentFront + (stripDepth / 2);

          // Genera Bottom specifico
          if (layer.bottomTexture) {
            const bPlane = document.createElement("a-plane");
            bPlane.setAttribute("width", planeWidth);
            bPlane.setAttribute("height", stripDepth);
            bPlane.setAttribute("position", `0 ${(bottomYPos + 0.001 + (idx * 0.0005)).toFixed(4)} ${stripCenterZ.toFixed(4)}`);
            bPlane.setAttribute("rotation", "-90 0 0");
            bPlane.setAttribute("material", `src: url(${layer.bottomTexture}); transparent: true; alphaTest: 0.01; depthWrite: false; depthTest: true; side: double;`);
            bPlane.setAttribute("render-order", 2 + idx);
            targetEntity.appendChild(bPlane);
          }

          // Genera Top/Piano intermedio specifico
          if (layer.topTexture && layer.topYPos !== undefined) {
            const tPlane = document.createElement("a-plane");
            tPlane.setAttribute("width", planeWidth);
            tPlane.setAttribute("height", stripDepth);
            tPlane.setAttribute("position", `0 ${layer.topYPos.toFixed(4)} ${stripCenterZ.toFixed(4)}`);
            tPlane.setAttribute("rotation", "-90 0 0");
            tPlane.setAttribute("material", `src: url(${layer.topTexture}); transparent: true; alphaTest: 0.01; side: double; depthTest: true;`);
            tPlane.setAttribute("render-order", 4 + idx);
            targetEntity.appendChild(tPlane);
          }
        }
      });

      // ==========================================
      // 4. PARETE LATERALE PERPENDICOLARE SX (4x20 cm)
      // ==========================================
      const sideCenterX = -(planeWidth / 2); // -0.5 (bordo sinistro)
      const zLayer05Front = layersConfig[4].z + (thickness3mm / 2);
      const strip05CenterZ = zLayer05Front + (depth4cmRel / 2);

      const straightSide = document.createElement("a-plane");
      straightSide.setAttribute("width", depth4cmRel);   // 0.20 (4 cm)
      straightSide.setAttribute("height", planeHeight);  // 1.00 (20 cm)
      straightSide.setAttribute("position", `${sideCenterX.toFixed(4)} 0 ${strip05CenterZ.toFixed(4)}`);
      straightSide.setAttribute("rotation", "0 90 0");
      straightSide.setAttribute("material", `src: url(${sideTexture}); transparent: true; alphaTest: 0.01; side: double; depthTest: true;`);
      straightSide.setAttribute("render-order", 15);
      targetEntity.appendChild(straightSide);

      // ==========================================
      // 5. GENERAZIONE LAYER DIORAMA ED EXTRA OVERLAY
      // ==========================================
      layersConfig.forEach((layer, idx) => {
        // Layer principale
        const element = document.createElement("a-box");
        element.setAttribute("width", planeWidth);
        element.setAttribute("height", planeHeight);
        element.setAttribute("depth", layer.thickness); 
        element.setAttribute("position", `0 0 ${layer.z.toFixed(4)}`);
        element.setAttribute("material", `src: url(${layer.src}); transparent: true; alphaTest: 0.01; side: front; depthTest: true;`);
        element.setAttribute("render-order", 10 + idx);
        targetEntity.appendChild(element);

        // Generazione condizionale dell'Extra Overlay (se configurato)
        if (layer.extraOverlay) { 
          const overlayZPos = layer.z + layer.extraOverlay.offsetZ;

          const overlayBox = document.createElement("a-box");
          overlayBox.setAttribute("width", planeWidth);
          overlayBox.setAttribute("height", planeHeight);
          overlayBox.setAttribute("depth", thickness3mm); 
          overlayBox.setAttribute("position", `0 0 ${overlayZPos.toFixed(4)}`);
          overlayBox.setAttribute("material", `src: url(${layer.extraOverlay.src}); transparent: true; alphaTest: 0.01; depthWrite: false; depthTest: true; side: front;`);
          overlayBox.setAttribute("render-order", 20 + idx);
          targetEntity.appendChild(overlayBox);
        }
      });
    });
  </script>
</body>
</html>
